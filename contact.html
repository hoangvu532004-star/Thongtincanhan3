<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - Nguyễn Văn A</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="index.html">Trang chủ</a>
        <a href="about.html">Giới thiệu</a>
        <a href="contact.html">Liên hệ</a>
    </nav>
    <header>
        <img src="images/avatar.jpg" alt="Avatar" class="avatar">
        <h1>Liên hệ</h1>
        <p>Kết nối với mình qua các kênh dưới đây</p>
    </header>
    <section>
        <h2>Thông tin liên hệ</h2>
        <div class="project">
            <p><strong>Email:</strong> example@email.com</p>
            <p><strong>GitHub:</strong> github.com/your-username</p>
            <p><strong>Facebook:</strong> facebook.com/your-profile</p>
        </div>
        <h2>Gửi lời nhắn</h2>
        <div class="project">
            <form onsubmit="event.preventDefault(); alert('Cảm ơn bạn đã gửi lời nhắn!');">
                <p><input type="text" placeholder="Họ tên" style="width:100%;padding:10px;margin:5px 0;"></p>
                <p><input type="email" placeholder="Email" style="width:100%;padding:10px;margin:5px 0;"></p>
                <p><textarea placeholder="Nội dung" rows="4" style="width:100%;padding:10px;margin:5px 0;"></textarea></p>
                <p><button type="submit" style="padding:10px 20px;background:#333;color:white;border:none;border-radius:4px;cursor:pointer;">Gửi</button></p>
            </form>
        </div>
    </section>
    <script src="js/script.js"></script>
</body>
